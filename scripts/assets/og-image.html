<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,500;0,700;0,800;1,700&family=Geist+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{
    font-family:"Plus Jakarta Sans",sans-serif;
    background:#F4F4F9;
    position:relative;
  }
  .glow{
    position:absolute;top:-12%;left:38%;width:120%;height:130%;
    background:
      radial-gradient(40% 40% at 30% 50%,rgba(255,120,180,.55) 0%,transparent 70%),
      radial-gradient(35% 40% at 65% 45%,rgba(120,90,255,.55) 0%,transparent 70%),
      radial-gradient(30% 35% at 80% 60%,rgba(255,160,90,.45) 0%,transparent 70%),
      radial-gradient(35% 35% at 20% 70%,rgba(80,140,255,.40) 0%,transparent 70%);
    filter:blur(50px);opacity:.75;
  }
  .card{position:relative;z-index:1;width:100%;height:100%;padding:76px 84px;display:flex;flex-direction:column;justify-content:space-between}
  .brand{display:flex;align-items:center;gap:14px;font-size:28px;font-weight:700;letter-spacing:-0.01em;color:#0A0A0F}
  .brand .mark{width:36px;height:36px;background:#0A0A0F;color:#fff;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:20px}
  .brand em{font-style:italic}
  .eyebrow{font-family:"Geist Mono",monospace;font-size:15px;letter-spacing:.16em;text-transform:uppercase;color:#6E6E78;margin-bottom:26px}
  .eyebrow b{color:#4D4DFF;font-weight:500}
  h1{font-size:64px;font-weight:800;letter-spacing:-0.03em;line-height:1.06;color:#0A0A0F;max-width:920px}
  h1 em{font-style:italic;color:#4D4DFF}
  .meta{display:flex;gap:48px;font-family:"Geist Mono",monospace;font-size:15px;color:#6E6E78;letter-spacing:.02em}
  .meta b{display:block;color:#0A0A0F;font-family:"Plus Jakarta Sans",sans-serif;font-weight:700;font-size:18px;margin-top:6px}
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="card">
    <div class="brand"><span class="mark">⚡</span><span>Silver <em>Signal</em></span></div>
    <div>
      <div class="eyebrow"><b>RevOps</b> for Personal Injury Law Firms</div>
      <h1>Sign more cases.<br/>Catch <em>every</em> lead.</h1>
    </div>
    <div class="meta">
      <div>Stack<b>Salesforce + AI</b></div>
      <div>Response Time<b>&lt; 5 minutes</b></div>
      <div>Result<b>More signed cases</b></div>
    </div>
  </div>
</body>
</html>
