name: Rebuild blog + sitemap

# Keeps /blog, /contact, and sitemap.xml in sync with content/blog/*.md
# automatically. Runs whenever a post is added/edited/removed (or the
# templates/build script change) on main, and can also be triggered by hand.
on:
  push:
    branches: [main]
    paths:
      - "content/blog/**"
      - "scripts/**"
      - "styles/site.css"
      - "package.json"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build site (blog, contact, sitemap.xml)
        run: npm run build

      - name: Commit regenerated output, if any
        run: |
          if git diff --quiet; then
            echo "Nothing changed, skipping commit."
            exit 0
          fi
          git config user.name "silver-signal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add blog contact sitemap.xml
          git commit -m "chore: rebuild blog, contact page, and sitemap.xml [skip ci]"
          git push
